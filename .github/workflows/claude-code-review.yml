# Automated PR review, using Anthropic's official Claude Code GitHub Action
# (Project 12's "also covers" requirement). Runs whenever a pull request is
# opened, updated, reopened, or marked ready for review, and posts Claude's
# review directly onto the PR -- inline comments on issues it finds, or one
# summary comment when it finds none.
#
# Requires, once per repo (see chat log for the exact steps):
#   1. The Claude GitHub App installed on this repository
#      (https://github.com/apps/claude)
#   2. An ANTHROPIC_API_KEY secret added under
#      Settings -> Secrets and variables -> Actions
name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
